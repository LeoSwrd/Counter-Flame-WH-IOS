name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          xcrun -sdk iphoneos clang++ -arch arm64 -dynamiclib -std=c++17 -O2 \
            -fobjc-arc -Wl,-undefined,dynamic_lookup \
            -framework UIKit -framework Foundation -framework Metal -framework QuartzCore \
            esp_chams.mm -o esp_chams.dylib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: esp_chams.dylib
